# Deploy the app to GitHub Pages on every push to the default branch.
#
# Race-condition note: the committed data/ in the repo is only a SEED. The
# freshest enrichment catalogue is published by enrich.yml to the orphan
# `enrichment-data` branch (and to the live site). Because this workflow uploads
# the whole tree (path: '.'), deploying the committed seed would clobber the live
# site with stale data on every code push. To prevent that, we overlay the
# latest data/ from the enrichment-data branch before uploading, falling back to
# the committed seed only when that branch doesn't exist yet (first deploy).
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Overlay latest enrichment data
        # Replaces the committed seed data/ with the newest catalogue published
        # by enrich.yml, so a code-only push can't roll the live site back to
        # stale data. The workflow-level `concurrency: pages` group is shared
        # with enrich.yml, so this run cannot start while an enrich run is in
        # flight — by the time we fetch, enrich has already pushed its data.
        # The manifest check guards the seed: we only drop it once we know the
        # replacement tree is actually there.
        run: |
          set -euo pipefail
          if git fetch --depth=1 origin enrichment-data 2>/dev/null \
             && git cat-file -e FETCH_HEAD:data/manifest.json 2>/dev/null; then
            rm -rf data
            git checkout FETCH_HEAD -- data
            echo "Deploying data/ from enrichment-data ($(git rev-parse --short FETCH_HEAD))."
          else
            echo "No usable enrichment-data branch — deploying the committed seed data/."
          fi
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
