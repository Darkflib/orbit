# Deploy the app to GitHub Pages on every push to the default branch.
#
# The committed data/ is deployed as-is. It is the app's *fallback* catalogue:
# src/data.js fetches from the orbit-data service first and only reads these
# files when that origin is unreachable. mirror-catalogue.yml refreshes them
# weekly from the published tree, and its commit lands on main, so the deploy it
# triggers is what ships the refreshed copy.
#
# This used to overlay data/ from an orphan `enrichment-data` branch, because a
# second build pipeline in this repo published fresher data than the committed
# seed and a code-only push would otherwise have rolled the live site back. That
# pipeline is gone; there is nothing fresher to overlay.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
