# Monthly: fast-forward the committed data/ seed on main to the catalogue
# currently published on the `enrichment-data` branch.
#
# Why this exists: enrich.yml never commits its freshly built data/ back to main
# — it deploys it and publishes it to `enrichment-data`, and static.yml overlays
# that branch at deploy time. The live site is therefore always current, but the
# data/ committed in the repo would otherwise drift stale forever. That copy
# still matters for two things:
#   - a fresh clone (`node serve.mjs`) serves it, so local dev sees real data
#     rather than a months-old catalogue;
#   - it is static.yml's fallback if `enrichment-data` is ever missing or broken.
# Syncing monthly bounds how wrong both get without putting a data-churn commit
# on main every single day.
#
# Cheap in history terms: write.mjs emits data/ deterministically (sorted keys
# and records, no per-run timestamp outside manifest.json), so each snapshot
# deltas against the previous one to a few hundred KB in the pack — not 26 MB.
#
# Actions are pinned to full commit SHAs (tag in a trailing comment) so a moved
# tag can't silently change what runs in CI.
name: Sync data seed to main

on:
  schedule:
    # 07:47 UTC on the 1st — comfortably after the 06:17 daily enrich run, so
    # the seed picks up that morning's freshly published catalogue.
    - cron: '47 7 1 * *'
  workflow_dispatch:

permissions:
  contents: write   # commit the refreshed seed to main

# Deliberately NOT the `pages` group: this job never deploys, so it must not
# queue behind (or hold up) a deployment. It only needs to not overlap itself.
concurrency:
  group: "sync-data-seed"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Sync seed from enrichment-data
        run: |
          set -euo pipefail

          if ! git fetch --depth=1 origin enrichment-data 2>/dev/null \
             || ! git cat-file -e FETCH_HEAD:data/manifest.json 2>/dev/null; then
            echo "No usable enrichment-data branch — nothing to sync."
            exit 0
          fi

          NEW=$(git show FETCH_HEAD:data/manifest.json | jq -r '.generatedAt')
          OLD=$(jq -r '.generatedAt' data/manifest.json)
          echo "seed generatedAt: ${OLD}"
          echo "branch generatedAt: ${NEW}"

          # ISO-8601 UTC timestamps sort lexicographically. Never move the seed
          # backwards: a rolled-back or force-pushed branch must not regress main.
          if ! [[ "$NEW" > "$OLD" ]]; then
            echo "Published catalogue is not newer than the seed — nothing to sync."
            exit 0
          fi

          # rm first so buckets that no longer exist upstream don't linger; the
          # `git add -A` below then stages those deletions.
          rm -rf data
          git checkout FETCH_HEAD -- data

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Seed is already byte-identical to the published catalogue."
            exit 0
          fi

          # [skip ci]: the live site already serves exactly this data (enrich.yml
          # deployed it, and static.yml overlays the same branch), so letting this
          # commit trigger a deploy would republish identical bytes for nothing.
          git commit -q -m "data: sync seed to published catalogue ${NEW} [skip ci]"

          # main is busy rarely, but never lose the race to a concurrent push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Seed synced to ${NEW}."
              exit 0
            fi
            echo "push rejected — rebasing on main and retrying (${attempt}/3)"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Seed sync conflicts with a concurrent change to data/ — skipping this run."
              exit 1
            fi
          done
          echo "Could not push the seed after 3 attempts."
          exit 1
