# Run the unit test suite (physics: visibility, passes, ephemeris) on every push
# and pull request, and audit dependencies. Tests use Node's built-in runner;
# the dev-only dependencies are satellite.js and astronomy-engine (the app
# itself still loads both from a CDN import map).
#
# Actions are pinned to full commit SHAs (with the human-readable tag in a
# trailing comment) so a moved tag can't silently change what runs in CI.
name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege: the test job only needs to read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Audit dependencies
        # Fail the build on a high/critical advisory in the dependency tree.
        run: npm audit --audit-level=high
      - name: Run tests
        run: npm test
