# Run the unit test suite (physics: visibility, passes, ephemeris) on every push
# and pull request. Tests use Node's built-in runner; the only dependency is
# satellite.js (dev-only — the app itself still loads it from a CDN import map).
name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Run tests
        run: npm test
