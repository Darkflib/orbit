# Rebuild the enrichment catalogue (SATCAT + GCAT + mmccants) on a slow cadence
# and redeploy the site with fresh data. Decoupled from the 2-hour GP hot path,
# which runs client-side and is never touched here.
#
# Deploy model: this workflow builds data/ fresh and deploys the WHOLE tree
# (app + freshly built data) as the Pages artifact — deploy-pages publishes an
# artifact as the entire site. It shares static.yml's `concurrency: pages`
# group so the two serialise instead of racing.
#
# The freshly built data/ is pushed to an orphan `enrichment-data` branch, which
# is the source of truth for published data: static.yml overlays it at deploy
# time so a code-only push to main can't roll the live site back to the stale
# data/ committed in the repo (that copy is a seed for local dev and static.yml's
# fallback; sync-data-seed.yml fast-forwards it monthly). The push
# stays non-blocking — shipping fresh data to the site matters more than
# recording it — but a failure now means the next static.yml deploy serves the
# previous run's data until the next enrich run repairs it, so it is logged
# loudly rather than swallowed as "no change".
name: Refresh enrichment data

on:
  schedule:
    # Daily, off the hour. Conditional-GET (scripts/enrich/http.mjs) makes a
    # no-change run cheap; the validation gate aborts before deploy on breakage.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # push the orphan enrichment-data history branch
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  enrich:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20

      - name: Build enrichment data
        run: node scripts/enrich/build.mjs

      - name: Publish data to enrichment-data branch (non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin enrichment-data || true
          if git show-ref --verify --quiet refs/remotes/origin/enrichment-data; then
            git worktree add /tmp/datab enrichment-data
          else
            git worktree add --orphan -b enrichment-data /tmp/datab
          fi
          rm -rf /tmp/datab/data
          cp -r data /tmp/datab/data
          cd /tmp/datab
          git add -A data
          # Distinguish "nothing changed" from "the push failed" — the latter
          # leaves static.yml serving the previous run's data, so it must not
          # masquerade as a clean no-op run.
          if git diff --cached --quiet; then
            echo "no enrichment change this run — enrichment-data already current"
          else
            git commit -m "data: refresh ${GITHUB_RUN_ID}"
            git push origin enrichment-data
          fi

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact (app + fresh data)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
